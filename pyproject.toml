[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "server-starter"
version = "0.1.0"
description = "Python + FastAPI 기반의 재사용 가능한 최소 server-starter"
readme = "README.md"
authors = [
    { name = "05ovo2e", email = "jiwonpark2229@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
managed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
